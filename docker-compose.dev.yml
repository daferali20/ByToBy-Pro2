version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: bytoby_postgres_dev
    environment:
      POSTGRES_USER: bytoby_user
      POSTGRES_PASSWORD: bytoby_password
      POSTGRES_DB: bytoby_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: bytoby_redis_dev
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: bytoby_backend_dev
    environment:
      DATABASE_URL: postgresql://bytoby_user:bytoby_password@postgres:5432/bytoby_db
      REDIS_URL: redis://redis:6379
      ENVIRONMENT: development
      DEBUG: True
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data
      - ./logs:/app/logs
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: bytoby_frontend_dev
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules

  celery_worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: bytoby_celery_dev
    environment:
      DATABASE_URL: postgresql://bytoby_user:bytoby_password@postgres:5432/bytoby_db
      REDIS_URL: redis://redis:6379
      ENVIRONMENT: development
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data
      - ./logs:/app/logs
    command: celery -A app.celery worker --loglevel=info

volumes:
  postgres_data_dev:
